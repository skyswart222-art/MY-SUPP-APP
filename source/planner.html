* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { background: var(--bg); }
html::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--bg); background-image: var(--fade), var(--noise), var(--photo); background-size: auto, 200px 200px, cover; background-position: center; transition: background-image .4s; }
body { background: transparent; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
/* Headings in Instrument Serif: light and elegant. Sized up so they match the body text visually. */
:root { --font-head: "Instrument Serif", Georgia, "Times New Roman", serif; }
h1, h2, h3, .brand { font-family: var(--font-head) !important; font-weight: 400 !important; letter-spacing: 0.012em; font-size-adjust: 0.5; -webkit-text-stroke: 0.018em currentColor; }
/* Instrument Serif only comes in one weight, so a hairline outline in the text colour makes it a touch thicker. */

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
.modules { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.modules::-webkit-scrollbar { display: none; }
.mod { flex: none; border: 1px solid transparent; background: var(--sunk); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.mod[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.mod[disabled] { opacity: .55; cursor: default; }
.modarr { display: inline-flex; align-items: center; padding: 4px 10px; }
.modord { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.modord li { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.modord .iconbtn[disabled], .krow .iconbtn[disabled] { opacity: .3; }
.syncnote { font-size: 12px; color: var(--muted); }

main .wrap { padding-block: 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .row { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab .dot { position: absolute; top: 9px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 10px; line-height: 16px; font-family: var(--font-data); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
:root[data-theme="light"] .card { box-shadow: 0 6px 20px rgba(60,50,30,.06); }
/* Neon "lit" look: a white-hot rim, then the colour blooming outward (like a glowing sign) */
:root { --rim: color-mix(in srgb, var(--accent) 35%, #fff); }
.btn.primary, .mod[aria-current="true"] {
  border-color: var(--rim) !important;
  box-shadow: inset 0 0 8px color-mix(in srgb, #fff 45%, transparent), 0 0 0 1px var(--rim), 0 0 6px 1px var(--rim), 0 0 16px 2px var(--glow), 0 0 34px 6px var(--glow2), 0 0 60px 12px color-mix(in srgb, var(--accent) 18%, transparent);
}
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .mod[aria-current="true"] {
  box-shadow: inset 0 0 10px color-mix(in srgb, #fff 50%, transparent), 0 0 0 1px var(--rim), 0 0 8px 2px var(--rim), 0 0 20px 4px var(--glow), 0 0 44px 10px var(--glow2), 0 0 80px 18px color-mix(in srgb, var(--accent) 22%, transparent);
}
.modules { padding: 14px 10px; margin: -14px -10px; }
.tab[aria-current="page"] svg { filter: drop-shadow(0 0 2px var(--rim)) drop-shadow(0 0 8px var(--glow)) drop-shadow(0 0 16px var(--glow2)); }
.tab[aria-current="page"] span { text-shadow: 0 0 12px var(--glow); }
circle[stroke="var(--accent)"][stroke-width="14"] { filter: drop-shadow(0 0 2px var(--rim)) drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 22px var(--glow2)); }
.swatch i { box-shadow: 0 0 12px currentColor; }
/* Settings sheet */
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatch { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; text-align: left; }
.swatch i { flex: none; width: 28px; height: 28px; border-radius: 50%; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 12px; padding: 4px; gap: 4px; }
.seg2 button { border: 0; background: transparent; border-radius: 9px; padding: 9px 0; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrapflex { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
a.btn { text-decoration: none; color: var(--accent); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; }

/* Today */
.daybar { display: flex; align-items: center; gap: 8px; }
.daybar h2 { font-size: 22px; flex: 1; }
.progress { display: flex; align-items: center; gap: 12px; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.alert.crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
.alert b { font-weight: 600; }
.alert .pip { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--warn); }
.alert.crit .pip { background: var(--crit); }

.timeline { position: relative; display: flex; flex-direction: column; }
.hour { display: grid; grid-template-columns: 56px 1fr; gap: 10px; position: relative; }
.hour .lbl { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; padding-top: 2px; }
.hour .slot { border-left: 2px solid var(--line); padding: 0 0 0 14px; min-height: 26px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.hour.idle .slot { min-height: 18px; padding-bottom: 4px; }
.hour.idle .lbl { opacity: .55; }
.hour.past .lbl { opacity: .5; }
.hour.now .lbl { color: var(--accent); font-weight: 500; opacity: 1; }
.hour.now .slot { border-left-color: var(--accent); }
.nowline { position: absolute; left: 62px; right: 0; height: 0; border-top: 2px solid var(--accent); z-index: 1; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -6px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dose { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 8px; }
.dose .check { flex: none; width: 34px; height: 34px; padding: 0; color: inherit; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: var(--bg); }
.dose .check svg { width: 16px; height: 16px; opacity: 0; }
.dose.taken { background: var(--accent-soft); border-color: transparent; }
.dose.taken .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dose.taken .check svg { opacity: 1; }
.dose.taken .dname { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); }
.dose .dname { font-weight: 600; font-size: 15px; }
.dose .dmeta { font-size: 12.5px; color: var(--muted); }
.dose .dtime { font-family: var(--font-data); font-size: 12px; color: var(--muted); flex: none; }
.dose.low { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 55%, transparent); }
.slothead { display: flex; justify-content: flex-end; margin-top: -2px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 500; padding: 2px 0; }

/* Empty state */
.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h3 { font-size: 19px; }
.empty p { margin: 0; max-width: 34ch; color: var(--muted); }
.bottle { width: 64px; height: 64px; color: var(--accent); }

/* Totals */
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.ingname { font-weight: 600; }
.ingsrc { font-size: 12px; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-family: var(--font-data); font-size: 20px; font-weight: 500; }
.stat .k { font-size: 12px; color: var(--muted); }

/* Stock */
.stock { display: flex; flex-direction: column; gap: 10px; }
.sitem { display: flex; flex-direction: column; gap: 8px; }
.sitem .top { display: flex; gap: 10px; align-items: flex-start; }
.sitem h3 { font-size: 16.5px; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); text-transform: uppercase; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.ex { background: transparent; border: 1px dashed var(--line); }
.level { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.level > i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.level.warn > i { background: var(--warn); }
.level.crit > i { background: var(--crit); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.inline-confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--sunk); border-radius: 10px; font-size: 14px; }

/* Add / edit */
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border: 2px dashed var(--line); border-radius: 14px; display: grid; place-items: center; text-align: center; overflow: hidden; background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; }
.photo .ph svg { width: 28px; height: 28px; }
.photo .tag { position: absolute; left: 8px; top: 8px; z-index: 1; background: rgb(0 0 0 / .6); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.status { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); }
.status.err { background: var(--crit-soft); color: var(--ink); }
.status.ok { background: var(--accent-soft); }
form.f { display: flex; flex-direction: column; gap: 16px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin-bottom: 4px; padding: 0; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fgrid .full { grid-column: 1 / -1; }
label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
input.in, select.in, textarea.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 10px; font-size: 15px; color: var(--ink); }
textarea.in { min-height: 64px; resize: vertical; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick button { width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; color: var(--muted); }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.schedrow { display: grid; grid-template-columns: 1fr 84px 1.3fr 36px; gap: 8px; align-items: end; }
.ingrow { display: grid; grid-template-columns: 1.6fr 1fr 84px 36px; gap: 8px; align-items: end; }
.ingrow label.fl span, .schedrow label.fl span { white-space: nowrap; }
.hint { font-size: 12.5px; color: var(--muted); }
.sticky-save { position: sticky; bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: flex-end; padding: 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-radius: 14px; backdrop-filter: blur(6px); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .meter > i { transition: none; } }
/* Overview (rings) */
.ov-head { display: flex; align-items: center; gap: 8px; }
.ov-title { font-size: 26px; font-weight: 600; }
.ov-top { display: flex; align-items: center; gap: 22px; padding: 4px 2px; }
.ov-ring { position: relative; width: 150px; height: 150px; flex: none; max-width: 42vw; max-height: 42vw; }
.ov-ring svg { width: 100%; height: 100%; display: block; }
.ov-ringtxt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ov-big { font-family: var(--font-display); font-size: 40px; font-weight: 600; line-height: 1; }
.ov-big span { font-size: 20px; color: var(--muted); }
.ov-stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.ov-stats > div { display: flex; flex-direction: column; min-width: 0; }
.ov-stats b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.ov-low { background: none; border: 0; color: var(--ink); font-weight: 600; font-size: 15px; text-align: left; padding: 0; }
.warntxt { color: var(--warn); }
.ov-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ov-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; min-width: 0; }
.ov-tile.is-next { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.ov-tlabel { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.ov-state { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.ov-state.done { color: var(--accent); }
.ov-state.next { color: var(--ink); font-weight: 500; }
.ov-state.late { color: var(--warn); }
.ov-ttime { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.ov-items { display: flex; flex-direction: column; gap: 4px; }
.ov-item { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ov-ck { flex: none; width: 34px; height: 34px; margin-left: -8px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--accent-ink); }
.ov-ck::before { content: ""; position: absolute; }
.ov-ck svg { width: 20px; height: 20px; padding: 3px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--muted); opacity: 1; stroke: transparent; }
.ov-item.taken .ov-ck svg { background: var(--accent); border-color: var(--accent); stroke: var(--accent-ink); }
.ov-name { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; text-align: left; font-size: 13px; color: var(--ink); line-height: 1.25; }
.ov-name span { display: block; font-size: 11.5px; color: var(--muted); }
.ov-item.taken .ov-name { color: var(--muted); }
#themebtn { width: 38px; height: 38px; border-radius: 12px; }
/* Workouts */
.wcard { display: flex; flex-direction: column; gap: 4px; }
.wex { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.wexhead { display: flex; gap: 10px; align-items: center; }
.wkg { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); flex: none; }
.wkg input { width: 68px; padding: 7px 8px; text-align: right; }
.wsets { display: flex; flex-wrap: wrap; gap: 6px; }
.wset { min-width: 64px; height: 38px; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--bg); color: var(--muted); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px; }
.wset svg { width: 14px; height: 14px; }
.wset.done { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.wset span { font-family: var(--font-data); }
.wweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wwd { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); padding: 0; }
.wwd i { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-ink); }
.wwd i svg { width: 14px; height: 14px; }
.wwd.on i { background: var(--accent); border-color: var(--accent); }
.wwd.is-today span { color: var(--accent); font-weight: 600; }
.wdaychip { width: 34px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 11.5px; background: var(--sunk); color: var(--muted); }
.wdaychip.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.wexform { display: grid; grid-template-columns: 1.6fr 52px 64px 60px 60px 36px; gap: 6px; align-items: end; }
@media (max-width: 460px) { .wexform { grid-template-columns: repeat(4, minmax(0, 1fr)); } .wexform .wexname { grid-column: 1 / -1; } .wexform .iconbtn { grid-column: -2 / -1; justify-self: end; } }
/* Meals */
.mm { display: flex; flex-direction: column; gap: 3px; }
.mbar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.mbar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
/* Macro colours stay the same in every theme: protein mint teal, carbs honey gold, fat soft pink */
:root { --mp: #0f9e8c; --mc: #d99a12; --mf: #e0679e; }
:root[data-theme="dark"] { --mp: #5ad6c4; --mc: #ffc95c; --mf: #ff9fc8; }
.mbar.p > i { background: var(--mp); box-shadow: 0 0 8px color-mix(in srgb, var(--mp) 60%, transparent); }
.mbar.c > i { background: var(--mc); box-shadow: 0 0 8px color-mix(in srgb, var(--mc) 60%, transparent); }
.mbar.f > i { background: var(--mf); box-shadow: 0 0 8px color-mix(in srgb, var(--mf) 60%, transparent); }
.mbar.over.p > i, .mbar.over.c > i, .mbar.over.f > i { background: var(--warn); box-shadow: none; }
.mbar.over > i { background: var(--warn); }
.mplanned { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
.mplanned .num { font-size: 11.5px; margin-top: 2px; }
.mprep { display: flex; flex-direction: column; gap: 12px; }
.mprep-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.mprep-card.is-next { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 22px var(--glow2); }
.mprep-head { display: flex; align-items: center; gap: 12px; }
.mprep-n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.mprep-name { font-size: 24px; line-height: 1.1; }
.mprep-edit { border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 8px; display: inline-grid; }
.mprep-kcal { text-align: right; display: flex; flex-direction: column; line-height: 1.15; }
.mprep-kcal b { font-size: 18px; }
.mprep-mac { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.mprep-mac span { display: inline-flex; align-items: center; gap: 6px; }
.mprep-mac i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.mprep-card .mfood { font-size: 14px; padding: 7px 0; }
.mprep-card .madd { margin-top: 0; }
.mprep-tools { display: flex; flex-direction: column; gap: 2px; margin-right: -6px; }
.mren { display: flex; flex-direction: column; gap: 8px; }
.msave { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--line); }
.mtrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.mdaybar { padding: 10px 14px; display: flex; flex-direction: column; }
.madd.solid { border-style: solid; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mfood { display: flex; gap: 8px; align-items: baseline; width: 100%; border: 0; background: none; padding: 5px 0; text-align: left; font-size: 13px; color: var(--ink); border-bottom: 1px dashed var(--line); }
.mfood:last-child { border-bottom: 0; }
.madd { margin-top: auto; align-self: flex-start; border: 1px dashed var(--line); background: none; color: var(--accent); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.mweek { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; height: 170px; margin-top: 12px; padding-bottom: 20px; }
.mwcol { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.mwcol i { display: block; width: 70%; max-width: 30px; min-height: 2px; border-radius: 4px 4px 0 0; background: var(--accent); }
.mwcol i.over { background: var(--warn); }
.mwval { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.mwday { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); }
.mwday.is-today { color: var(--accent); font-weight: 600; }
.mtarget { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); opacity: .6; pointer-events: none; }
.mwrow .r, .mwhead .r { min-width: 0; }
.mwrow { width: 100%; white-space: nowrap; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; font-size: 14px; }
.mwrow:last-child { border-bottom: 0; }
/* Whole-day view */
.compact { padding: 4px 12px; }
.crow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.crow:last-child { border-bottom: 0; }
.ctime { font-size: 12.5px; color: var(--muted); padding-top: 5px; }
.crow.next .ctime { color: var(--accent); font-weight: 500; }
.crow.late .ctime { color: var(--warn); }
.crow.done .ctime { text-decoration: line-through; opacity: .6; }
.nexttag { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.cchips { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px 2px 2px; max-width: 100%; }
.cchip .cck { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; color: inherit; }
.cchip .cck svg { width: 13px; height: 13px; opacity: 0; }
.cchip .cname { background: none; border: 0; padding: 2px 4px; font-size: 13.5px; font-weight: 500; text-align: left; min-width: 0; }
.cchip .cname .muted { font-size: 12px; font-weight: 400; }
.cchip.taken { background: var(--accent-soft); border-color: transparent; }
.cchip.taken .cck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cchip.taken .cck svg { opacity: 1; }
.cchip.taken .cname { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); }
/* Week view */
.wk-card { padding: 8px 6px; }
table.wk { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 330px; }
table.wk th, table.wk td { padding: 3px 2px; border: 0; text-align: center; vertical-align: middle; }
table.wk .wk-name { width: 34%; text-align: left; padding-left: 6px; font-weight: 400; text-transform: none; letter-spacing: 0; }
table.wk .wk-name .linkbtn { display: block; color: var(--ink); font-weight: 600; font-size: 13px; text-align: left; line-height: 1.25; padding: 0; overflow-wrap: anywhere; }
table.wk .wk-name .num { font-size: 11px; color: var(--muted); }

<script>
(() => {
"use strict";

/* ---------- Plans registry: new modules slot in here ---------- */
const MODULES = [
  { id: "supplements", name: "Supplements", ready: true },
  { id: "workouts", name: "Workouts", ready: true },
  { id: "meals", name: "Meals", ready: true },
  { id: "progress", name: "Progress", ready: true },
  { id: "skincare", name: "Skincare", ready: true },
  { id: "cycle", name: "Cycle", ready: true },
  { id: "budget", name: "Budget", ready: true },
  { id: "todo", name: "To-do", ready: true },
];
/* The person's own order for the tabs at the top, saved with their settings (and on the phone for a fast start). */
function modOrdered() {
  let o = S.settings?.modOrder; if (!Array.isArray(o)) { try { o = JSON.parse(localStorage.getItem("planner.modorder") || "null"); } catch { o = null; } }
  const ids = (Array.isArray(o) ? o : []).filter((id) => MODULES.some((m) => m.id === id));
  return [...ids, ...MODULES.map((m) => m.id).filter((id) => !ids.includes(id))].map((id) => MODULES.find((m) => m.id === id));
}
function modOrderSheet() {
  const list = S.modEdit.map((id) => MODULES.find((m) => m.id === id)), n = list.length;
  return `<div class="sheet-bg" data-act="modcancel"><div class="sheet" role="dialog" aria-modal="true" aria-label="Arrange tabs" data-stop>
    <div class="grab"></div>
    <div class="row between"><h2 style="font-size:22px">Arrange tabs</h2><button class="iconbtn" data-act="modcancel" aria-label="Close">${I.x}</button></div>
    <p class="small muted" style="margin:0">Use the arrows to put the tabs in the order you want. The top one shows first.</p>
    <ol class="modord">${list.map((m, i) => `<li><span class="num muted">${i + 1}</span><b class="grow">${esc(m.name)}</b>
      <button class="iconbtn" data-act="modmove" data-i="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="Move ${esc(m.name)} up"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="iconbtn" data-act="modmove" data-i="${i}" data-d="1" ${i < n - 1 ? "" : "disabled"} aria-label="Move ${esc(m.name)} down"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></li>`).join("")}</ol>
    <div class="actions"><button class="btn" data-act="modcancel">Cancel</button><button class="btn primary" data-act="modsave" style="margin-left:auto">Save</button></div></div></div>`;
}

/* ---------- Icons ---------- */
const I = {
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16.5" height="11.5" rx="2.5"/><path d="M16 13.75h1.5"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17l5.5-5.5 4 4 7.5-7.5"/><path d="M15 8h5.5v5.5"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  totals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',

  add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  spend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3"/></svg>',
  dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  up: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  vial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v3M14 3v3"/><rect x="7" y="6" width="10" height="15" rx="2.5"/><path d="M7 12h10"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5c3.5 4.4 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.6 6-11z"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9a5 5 0 0 1 7 0M12 9.5l1.3-2"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  left: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  bottle: '<svg class="bottle" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="18" y="8" width="28" height="9" rx="2"/><path d="M16 17h32v37a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z"/><rect x="22" y="28" width="20" height="16" rx="2"/><path d="M27 36h10"/></svg>',
};

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, "0");
const dstr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const today = () => dstr(new Date());
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
const fmtHour = (h) => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? " AM" : " PM");
const fmtTime = (t) => { const [h, m] = t.split(":").map(Number); return `${h % 12 === 0 ? 12 : h % 12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const fmtN = (n, max = 2) => Number(n).toLocaleString(undefined, { maximumFractionDigits: max });
const plural = (n, w) => `${fmtN(n, 1)} ${w}${Math.abs(n) === 1 ? "" : "s"}`;
const COUNT_UNITS = ["capsule", "tablet", "softgel", "gummy", "scoop", "drop", "chew", "packet"];
const unitLabel = (u, n) => (COUNT_UNITS.includes(u) ? (n === 1 ? u : u + "s") : u);
const amountStr = (n, u) => `${fmtN(n, 1)} ${unitLabel(u, n)}`;

/* Ingredient units: mass converts to mg for summing; others summed as-is */
const MASS = { mcg: 0.001, "µg": 0.001, ug: 0.001, mg: 1, g: 1000 };
function normIng(name, amount, unit) {
  const u = String(unit || "").trim().toLowerCase().replace("μ", "µ");
  if (u in MASS) return { key: name.trim().toLowerCase() + "|mass", mg: amount * MASS[u], kind: "mass" };
  return { key: name.trim().toLowerCase() + "|" + u, val: amount, unit: unit || "", kind: "other" };
}
function fmtMass(mg) {
  if (mg >= 1000) return fmtN(mg / 1000, 2) + " g";
  if (mg < 1) return fmtN(mg * 1000, 1) + " mcg";
  return fmtN(mg, 1) + " mg";
}

/* ---------- State ---------- */
const S = {

const CURRENCIES = ["ZAR", "USD", "EUR", "GBP", "AUD", "CAD", "NZD", "INR", "NGN", "KES", "AED", "SGD", "CHF", "SEK", "NOK", "DKK", "JPY", "BRL", "MXN"];
function money(n, dp) {

  catch { return (S.settings.currency + " " + fmtN(n || 0, 2)); }

const monthKey = (s) => s.slice(0, 7);
const monthLabel = (k, long) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, long ? { month: "long", year: "numeric" } : { month: "short" }); };
function purchasesOf(s) { return (s.purchases || []).filter((p) => num(p.price) > 0).sort((a, b) => (a.date || "").localeCompare(b.date || "")); }
function allPurchases() { const out = []; for (const s of S.supps) for (const p of purchasesOf(s)) out.push({ ...p, s }); return out.sort((a, b) => (b.date || "").localeCompare(a.date || "")); }
/* Cost per counted unit (capsule, gram…) from the most recent purchase */
function unitCost(s) {
  const p = purchasesOf(s).slice(-1)[0];
  if (!p) return null;

/* ---------- Derived data ---------- */
const active = () => S.supps.filter((s) => s.status !== "cupboard");
const cupboard = () => S.supps.filter((s) => s.status === "cupboard");
function dosesFor(date) {
  const wd = parseD(date).getDay();
  const out = [];
  for (const s of active()) {
    const days = s.days && s.days.length ? s.days : ALL_DAYS;
    if (!days.includes(wd)) continue;
    (s.schedule || []).forEach((r) => { if (r.time) out.push({ s, time: r.time, servings: num(r.servings, 1), note: r.note || "", key: `${s.id}|${r.time}` }); });
  }
  return out.sort((a, b) => a.time.localeCompare(b.time) || a.s.name.localeCompare(b.s.name));
}
function dailyUnits(s) {
  const days = s.days && s.days.length ? s.days : ALL_DAYS;
  const perDay = (s.schedule || []).reduce((a, r) => a + num(r.servings, 1), 0) * num(s.servingSize, 1);
  return perDay * days.length / 7;
}
function stockInfo(s) {
  const rem = Math.max(0, num(s.remaining));
  const size = num(s.servingSize, 1) || 1;
  const servingsLeft = rem / size;
  const daily = s.status === "cupboard" ? 0 : dailyUnits(s);
  const daysLeft = daily > 0 ? rem / daily : null;
  const alertDays = num(s.alertDays, 10);
  let level = "ok";
  if (rem <= 0) level = "crit";
  else if (daysLeft !== null && daysLeft <= Math.max(3, alertDays / 3)) level = "crit";
  else if (daysLeft !== null && daysLeft <= alertDays) level = "warn";
  const full = num(s.containerAmount) || rem || 1;
  const pct = Math.max(0, Math.min(100, (rem / full) * 100));
  let outDate = null;
  if (daysLeft !== null) { const d = new Date(); d.setDate(d.getDate() + Math.floor(daysLeft)); outDate = d; }
  return { rem, servingsLeft, daily, daysLeft, level, pct, outDate };
}
function lowItems() {
  return active().map((s) => ({ s, i: stockInfo(s) })).filter((x) => x.i.level !== "ok")
    .sort((a, b) => (a.i.daysLeft ?? 0) - (b.i.daysLeft ?? 0));
}
function addIng(map, s, servings) {
  for (const g of s.ingredients || []) {
    const amt = num(g.amount);
    if (!g.name || !amt) continue;
    const n = normIng(g.name, amt * servings, g.unit);
    const e = map.get(n.key) || { name: g.name.trim(), kind: n.kind, unit: n.unit, total: 0, from: new Map() };
    const v = n.kind === "mass" ? n.mg : n.val;
    e.total += v;
    e.from.set(s.id, (e.from.get(s.id) || 0) + v);
    map.set(n.key, e);
  }
}
function plannedTotals(dates) {
  const map = new Map();
  for (const date of dates) for (const d of dosesFor(date)) addIng(map, d.s, d.servings);
  return map;
}
function takenTotals(dates) {
  const map = new Map();
  for (const date of dates) {
    const taken = S.days[date]?.taken || {};
    for (const [key, units] of Object.entries(taken)) {
      const s = S.supps.find((x) => x.id === key.split("|")[0]);
      if (!s) continue;
      addIng(map, s, num(units) / (num(s.servingSize, 1) || 1));

}

async function toggleDose(key, date) {
  const dose = dosesFor(date).find((d) => d.key === key);
  if (!dose) return;
  const day = S.days[date] || (S.days[date] = { date, taken: {} });
  const s = { ...dose.s };
  if (day.taken[key] != null) {
    s.remaining = num(s.remaining) + num(day.taken[key]);
    delete day.taken[key];
  } else {
    const units = dose.servings * num(s.servingSize, 1);
    day.taken[key] = units;
    s.remaining = Math.max(0, num(s.remaining) - units);
  }
  render();
  await Promise.all([saveDay(date), saveSupp(s)]);
}
async function takeAllAt(time, date) {
  const day = S.days[date] || (S.days[date] = { date, taken: {} });
  const todo = dosesFor(date).filter((d) => d.time.slice(0, 2) === time && day.taken[d.key] == null);
  const writes = [];
  for (const d of todo) {
    const units = d.servings * num(d.s.servingSize, 1);
    day.taken[d.key] = units;
    const s = { ...S.supps.find((x) => x.id === d.s.id) };
    s.remaining = Math.max(0, num(s.remaining) - units);
    writes.push(saveSupp(s));
  }
  render();
  await Promise.all([saveDay(date), ...writes]);
}

/* ---------- Photo autofill (Claude vision through the page's sample capability) ---------- */
async function shrink(file, maxDim = 1568, q = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = maxDim, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res) => cv.toBlob((b) => res(b || file), "image/jpeg", q));
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}

  } catch (e) {

function viewDay() {
  const date = S.date, isToday = date === today();
  const doses = dosesFor(date);
  const taken = S.days[date]?.taken || {};
  const done = doses.filter((d) => taken[d.key] != null).length;
  const d = parseD(date);
  const title = isToday ? "Today" : date === addDays(today(), -1) ? "Yesterday" : date === addDays(today(), 1) ? "Tomorrow" : DOW[d.getDay()];
  const sub = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const now = new Date(), nowH = now.getHours();
  const hours = doses.map((x) => Number(x.time.slice(0, 2)));
  const startH = Math.min(6, ...hours), endH = Math.max(22, ...hours);
  const low = lowItems();
  const lowIds = new Set(low.map((x) => x.s.id));
  let html = `<div class="daybar"><button class="iconbtn" data-act="day" data-n="-1" aria-label="Previous day">${I.left}</button>
    <div class="grow"><h2>${title}</h2><div class="muted small">${esc(sub)}</div></div>
    ${isToday ? "" : `<button class="btn sm" data-act="day" data-n="0">Today</button>`}
    <button class="iconbtn" data-act="day" data-n="1" aria-label="Next day">${I.right}</button></div>`;
  html += `<div class="card progress"><div class="grow"><div class="row between"><span class="eyebrow">Taken</span><span class="num small">${done} of ${doses.length}</span></div>
    <div class="meter" style="margin-top:6px"><i style="width:${doses.length ? (done / doses.length) * 100 : 0}%"></i></div></div></div>`;
  if (low.length && isToday) {
    html += `<div class="alerts">${low.slice(0, 3).map(({ s, i }) => `<div class="alert ${i.level === "crit" ? "crit" : ""}"><span class="pip"></span><div><b>${esc(s.name)}</b> ${i.rem <= 0 ? "is empty." : `runs out in about ${plural(Math.max(0, Math.floor(i.daysLeft)), "day")} (${amountStr(i.rem, s.unit)} left).`} <button class="linkbtn" data-act="tab" data-tab="stock">Restock</button></div></div>`).join("")}</div>`;
  }
  if (!doses.length) {
    html += `<div class="card empty"><h3>Nothing scheduled ${isToday ? "today" : "this day"}</h3><p>Supplements in your cupboard don't show here until you give them a time.</p><button class="btn" data-act="tab" data-tab="stock">Open stock</button></div>`;
    return html;
  }
  html += `<div class="row between"><span class="eyebrow">${S.todayView === "compact" ? "Whole day" : "Hour by hour"}</span>${viewSwitch()}</div>`;
  if (S.todayView === "compact") {
    const times = [...new Set(doses.map((x) => x.time))];
    const nowT = `${pad(nowH)}:${pad(now.getMinutes())}`;
    const nextT = isToday ? times.find((t) => t >= nowT) : null;
    html += `<div class="card compact">`;
    for (const t of times) {
      const at = doses.filter((x) => x.time === t);
      const allDone = at.every((x) => taken[x.key] != null);
      const past = isToday && t < nowT;
      html += `<div class="crow ${allDone ? "done" : ""} ${past && !allDone ? "late" : ""} ${t === nextT ? "next" : ""}"><div class="ctime num">${fmtTime(t)}${t === nextT ? '<br><span class="nexttag">Next</span>' : ""}</div><div class="cchips">${at.map((x) => {
        const tk = taken[x.key] != null;
        return `<span class="cchip ${tk ? "taken" : ""}"><button class="cck" data-act="dose" data-key="${esc(x.key)}" aria-pressed="${tk}" aria-label="${tk ? "Taken. Tap to undo" : "Mark taken"}: ${esc(x.s.name)}">${I.check}</button><button class="cname" data-act="detail" data-id="${x.s.id}">${esc(x.s.name)} <span class="muted num">${amountStr(x.servings * num(x.s.servingSize, 1), x.s.unit)}</span></button></span>`;
      }).join("")}</div></div>`;
    }
    html += `</div>`;
    return html;
  }
  html += `<div class="timeline" id="timeline">`;
  for (let h = startH; h <= endH; h++) {
    const hh = pad(h);
    const at = doses.filter((x) => x.time.slice(0, 2) === hh);
    const cls = [at.length ? "" : "idle", isToday && h < nowH ? "past" : "", isToday && h === nowH ? "now" : ""].join(" ");
    const open = at.filter((x) => taken[x.key] == null).length;
    html += `<div class="hour ${cls}" data-h="${h}"><div class="lbl">${fmtHour(h)}</div><div class="slot">`;
    if (isToday && h === nowH) html += `<div class="nowline" style="top:${(now.getMinutes() / 60) * 100}%;left:-14px" aria-hidden="true"></div>`;
    for (const x of at) {
      const t = taken[x.key] != null;
      const units = x.servings * num(x.s.servingSize, 1);
      const ing = (x.s.ingredients || []).slice(0, 2).map((g) => `${esc(g.name)} ${fmtN(num(g.amount) * x.servings, 1)} ${esc(g.unit)}`).join(" · ");
      html += `<div class="dose ${t ? "taken" : ""} ${lowIds.has(x.s.id) ? "low" : ""}">
        <button class="check" data-act="dose" data-key="${esc(x.key)}" aria-pressed="${t}" aria-label="${t ? "Taken. Tap to undo" : "Mark taken"}: ${esc(x.s.name)}">${I.check}</button>
        <button class="info" data-act="detail" data-id="${x.s.id}"><span class="dname">${esc(x.s.name)}</span><br><span class="dmeta"><span class="num">${amountStr(units, x.s.unit)}</span>${x.note ? " · " + esc(x.note) : ""}${ing ? "<br>" + ing : ""}</span></button>
        <span class="dtime">${fmtTime(x.time)}</span></div>`;
    }
    if (open > 1) html += `<div class="slothead"><button class="linkbtn" data-act="takeall" data-h="${hh}">Mark all ${open} taken</button></div>`;
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function viewTotals() {
  if (!S.supps.length) return emptyState();
  const mode = S.totalsMode === "taken" ? "taken" : "planned";
  const week = weekDates(S.date);
  const last7 = Array.from({ length: 7 }, (_, i) => addDays(today(), -i));
  const dayMap = mode === "planned" ? plannedTotals([S.date]) : takenTotals([S.date]);
  const weekMap = mode === "planned" ? plannedTotals(week) : takenTotals(last7);
  const keys = [...new Set([...weekMap.keys(), ...dayMap.keys()])].sort((x, y) => (weekMap.get(x) || dayMap.get(x)).name.localeCompare((weekMap.get(y) || dayMap.get(y)).name));
  const isToday = S.date === today();
  const dayLabel = isToday ? "Today" : parseD(S.date).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const weekLabel = mode === "planned" ? `Week of ${parseD(week[0]).toLocaleDateString(undefined, { day: "numeric", month: "short" })}` : "Last 7 days";
  const doseCount = dosesFor(S.date).length;
  const unitsPerDay = active().reduce((a, s) => a + (COUNT_UNITS.includes(s.unit) ? dailyUnits(s) : 0), 0);

  html += `<div class="statgrid"><div class="stat"><div class="v">${active().length}</div><div class="k">supplements in your stack</div></div>
    <div class="stat"><div class="v">${doseCount}</div><div class="k">doses ${isToday ? "today" : "that day"}</div></div>
    <div class="stat"><div class="v">${fmtN(unitsPerDay, 0)}</div><div class="k">pills a day on average</div></div></div>`;
  if (!keys.length) html += `<div class="card empty"><p>${mode === "taken" ? "Nothing ticked off yet. Tick doses on Today and they add up here." : "Add ingredients to your supplements to see totals here."}</p></div>`;
  else {
    html += `<div class="card" style="padding:4px 12px"><div class="ingrid inghead"><span>Ingredient</span><span class="r">${esc(dayLabel)}</span><span class="r">${mode === "planned" ? "Week" : "7 days"}</span></div>`;
    for (const k of keys) {
      const d = dayMap.get(k), w = weekMap.get(k), e = w || d;
      const ids = [...new Set([...(w?.from.keys() || []), ...(d?.from.keys() || [])])];
      html += `<details class="ingdet"><summary class="ingrid"><span><span class="ingname">${esc(e.name)}</span><br><span class="ingsrc">${ids.length} supplement${ids.length === 1 ? "" : "s"}</span></span><span class="r num">${d ? fmtV(e, d.total) : '<span class="muted">–</span>'}</span><span class="r num">${w ? fmtV(e, w.total) : '<span class="muted">–</span>'}</span></summary>
        ${ids.map((id) => { const s = S.supps.find((x) => x.id === id); return `<div class="ingrid sub"><button class="linkbtn" data-act="detail" data-id="${id}">${esc(s?.name || "Removed supplement")}</button><span class="r num">${d?.from.get(id) ? fmtV(e, d.from.get(id)) : "–"}</span><span class="r num">${w?.from.get(id) ? fmtV(e, w.from.get(id)) : "–"}</span></div>`; }).join("")}</details>`;
    }
    html += `</div>`;
  }
  html += `<p class="hint">mcg, mg and g are combined for the same ingredient name. Other units (IU, CFU) are listed separately. These are sums from your labels, not medical advice.</p>`;
  const stack = active().slice().sort((a, b) => a.name.localeCompare(b.name));
  html += `<section class="stock"><div class="eyebrow">Your stack · ${stack.length}</div><div class="card plist" style="padding:2px 14px">${stack.map((s) => {
    const servings = (s.schedule || []).reduce((a, r) => a + num(r.servings, 1), 0);

  return html;

function viewSpend() {
  if (!S.supps.length) return emptyState();
  const buys = allPurchases();
  const cur = monthKey(today());
  const months = Array.from({ length: 12 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (11 - i)); return dstr(d).slice(0, 7); });
  const byMonth = Object.fromEntries(months.map((m) => [m, 0]));
  for (const b of buys) if (b.date && monthKey(b.date) in byMonth) byMonth[monthKey(b.date)] += num(b.price);
  const sel = S.spendMonth && S.spendMonth in byMonth ? S.spendMonth : cur;
  const year = months.reduce((a, m) => a + byMonth[m], 0);
  const runRate = active().reduce((a, s) => a + (costInfo(s)?.perMonth || 0), 0);
  const priced = active().filter((s) => costInfo(s));

  const max = Math.max(1, ...months.map((m) => byMonth[m]));

  }
  // Monthly purchases chart (single series)
  html += `<div class="card"><div class="row between"><div><div class="eyebrow">Bought per month</div><div class="small muted">Tap a month to see what you bought</div></div><div class="small num muted">max ${money(max)}</div></div>

    <div class="barlbls">${months.map((m, i) => `<span>${i % 2 === 11 % 2 ? monthLabel(m).slice(0, 3) : ""}</span>`).join("")}</div></div>`;
  const inMonth = buys.filter((b) => b.date && monthKey(b.date) === sel);
  html += `<div style="margin-top:14px"><div class="eyebrow">${monthLabel(sel, true)}</div><div class="plist">${inMonth.length ? inMonth.map((b) => `<div class="pi"><button class="linkbtn grow" style="text-align:left" data-act="detail" data-id="${b.s.id}">${esc(b.s.name)}</button><span class="small muted num">${parseD(b.date).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span><span class="num">${money(num(b.price), 2)}</span></div>`).join("") : '<div class="pi small muted">Nothing bought this month.</div>'}</div></div></div>`;

      <div class="small muted num">${runRate ? Math.round((c.perMonth / runRate) * 100) : 0}% · ${money(c.perServing, 2)} a serving · ${money(c.perDay, 2)} a day</div></div>`).join("") || '<div class="small muted">Add prices to the supplements you take to see this.</div>'}</div>
    ${unpriced.length ? `<div class="hint">No price yet for ${unpriced.map((s) => esc(s.name)).join(", ")}.</div>` : ""}</section>`;
  // Cupboard value
  const cupVal = cupboard().reduce((a, s) => { const uc = unitCost(s); return a + (uc ? uc * num(s.remaining) : 0); }, 0);
  if (cupVal) html += `<div class="card row between"><div><div class="eyebrow">Sitting in the cupboard</div><div class="small muted">Value of what's left in supplements you're not taking</div></div><div class="num">${money(cupVal)}</div></div>`;

  return html;
}

async function storePhoto(blob) {

function setZoom(z, cx, cy) {
  const area = $("#zarea"), img = $("#zimg");
  if (!area || !img) return;
  const old = S.zoom.z; z = Math.max(1, Math.min(6, z)); S.zoom.z = z;
  const rect = area.getBoundingClientRect();
  const px = (cx ?? rect.width / 2), py = (cy ?? rect.height / 2);
  const fx = (area.scrollLeft + px) / old, fy = (area.scrollTop + py) / old;
  img.style.width = z * 100 + "%";
  area.scrollLeft = fx * z - px; area.scrollTop = fy * z - py;
  const lbl = document.querySelector(".zoom .zbar .small"); if (lbl) lbl.textContent = `${S.zoom.side === "front" ? "Front" : "Back"} · ${Math.round(z * 100)}%`;
}
function bindPinch() {
  const area = $("#zarea"); if (!area) return;
  const pts = new Map(); let start = null;
  area.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, e); if (pts.size === 2) { const [a, b] = [...pts.values()]; start = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: S.zoom.z }; } });
  area.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
    if (pts.size === 2 && start) { e.preventDefault(); const [a, b] = [...pts.values()]; const r = area.getBoundingClientRect(); setZoom(start.z * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / start.d, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); }
  });
  const end = (e) => { pts.delete(e.pointerId); if (pts.size < 2) start = null; };
  area.addEventListener("pointerup", end); area.addEventListener("pointercancel", end);
  area.addEventListener("dblclick", (e) => { const r = area.getBoundingClientRect(); setZoom(S.zoom.z > 1.5 ? 1 : 2.5, e.clientX - r.left, e.clientY - r.top); });
  area.addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); const r = area.getBoundingClientRect(); setZoom(S.zoom.z * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  area.style.touchAction = "pan-x pan-y";
}

async function pdfToInputs(file, maxImages) {

}

/* ---------- Cycle maths ---------- */
function niceAxis(lo, hi, n = 3) { const raw = (hi - lo) / n || 1, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const ticks = []; for (let v = a; v <= b + step / 2; v += step) ticks.push(+v.toFixed(6)); return { y0: a, y1: b, ticks }; }
const dDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const cAmt = (c) => (num(c.conc) > 0 ? num(c.dose) / num(c.conc) : 0);
const cAmtTxt = (c, amt = cAmt(c)) => (c.kind === "oral" ? plural(+amt.toFixed(2), "tab") : fmtN(amt, 2) + " mL");
const cUnitTxt = (c, v) => (c.kind === "oral" ? plural(+num(v).toFixed(1), "tab") : fmtN(num(v), 2) + " mL");
const cTaken = (id, date) => S.cy.days[date]?.taken?.[id];
function cDue(c, date) {
  if (c.start && date < c.start) return false;
  if (c.end && date > c.end) return false;
  if (c.freq === "every") { const e = num(c.every, 7); if (e <= 0) return false; const diff = dDiff(c.start || date, date); const k = Math.ceil(diff / e - 1e-9); return k * e < diff + 1 - 1e-9; }
  return (c.days || []).includes(parseD(date).getDay());
}
const cPerWeek = (c) => (c.freq === "every" ? 7 / Math.max(0.1, num(c.every, 7)) : (c.days || []).length);
const cRemain = (c) => num(c.open) + num(c.spare) * num(c.container);
const cDosesLeft = (c) => { const a = cAmt(c); return a > 0 ? Math.floor(cRemain(c) / a + 1e-6) : Infinity; };
const cEnded = (c) => c.end && c.end < today();
function cForecast(c) {
  let left = cDosesLeft(c), outOn = null, need = 0; const t = today();
  for (let i = 0; i < 730; i++) {
    const d = addDays(t, i); if (c.end && d > c.end) break;
    if (!cDue(c, d) || cTaken(c.id, d)) continue;
    need++; if (left <= 0 && !outOn) outOn = d; left--;
    if (!c.end && outOn) break;
  }
  return { outOn, need, short: c.end ? Math.max(0, need - cDosesLeft(c)) : 0 };
}
const cLow = (c) => !cEnded(c) && cAmt(c) > 0 && cDosesLeft(c) <= num(c.lowDoses, 4);
const schedTxt = (c) => (c.freq === "every" ? `every ${fmtN(num(c.every, 7), 1)} days` : (c.days || []).length === 7 ? "every day" : [1, 2, 3, 4, 5, 6, 0].filter((d) => (c.days || []).includes(d)).map((d) => DOW[d]).join(", ") || "no days set");
function curCycle(date = today()) { const cs = (S.cy.settings.cycles || []).slice().sort((a, b) => b.start.localeCompare(a.start)); return cs.find((c) => c.start <= date && (!c.end || date <= c.end)) || null; }
function cycWeek(cy, date) { const w = Math.floor(dDiff(cy.start, date) / 7) + 1; const tot = cy.end ? Math.ceil((dDiff(cy.start, cy.end) + 1) / 7) : null; return { w, tot }; }
const shortD = (d, o = { weekday: "short", day: "numeric", month: "short" }) => parseD(d).toLocaleDateString(undefined, o);

async function ctoggle(cid, date) {
  const c = S.cy.compounds.find((x) => x.id === cid); if (!c) return;
  const day = S.cy.days[date] || (S.cy.days[date] = { date, taken: {} }); day.taken = day.taken || {};
  const t = day.taken[cid];
  if (t) {
    let open = num(c.open) + num(t.amt); const spare = num(c.spare) + num(t.opened); open -= num(t.opened) * num(c.container);
    c.open = Math.max(0, +open.toFixed(4)); c.spare = spare; delete day.taken[cid];
    toast(`Undid ${c.name}. Stock put back.`);
  } else {
    const amt = cAmt(c); let open = num(c.open) - amt, opened = 0, spare = num(c.spare);
    while (open < -1e-6 && spare > 0 && num(c.container) > 0) { spare--; opened++; open += num(c.container); }
    c.open = Math.max(0, +open.toFixed(4)); c.spare = spare;
    day.taken[cid] = { at: new Date().toISOString(), mg: num(c.dose), amt, opened };
    if (opened) toast(`Logged. Opened a new ${c.kind === "oral" ? "bottle" : "vial"} of ${c.name}.`);
  }
  render(); await Promise.all([csaveDay(date), csaveComp(c)]);
}

/* ---------- Views ---------- */
function cycleView() {

}
function cToday() {

  if (!S.cy.compounds.length) {
    return html + `<div class="card empty"><h3>Set up your cycle</h3><p>Add each compound with its strength, dose and days. As you log doses, the app counts down what’s left in each vial and warns you before you run low.</p>

  }

  let next = "Nothing scheduled";
  for (let i = 1; i <= 90; i++) { const nd = addDays(date, i), ps = S.cy.compounds.filter((c) => cDue(c, nd)); if (ps.length) { next = `${i === 1 ? "Tomorrow" : i < 7 ? DOW[parseD(nd).getDay()] : shortD(nd, { day: "numeric", month: "short" })} · ${ps.map((c) => c.name).join(", ")}`; break; } }
  const C = 2 * Math.PI * 68, frac = due.length ? done / due.length : 0;
  const cw = cy ? cycWeek(cy, date) : null;
  html += `<div class="ov-top"><div class="ov-ring"><svg viewBox="0 0 160 160" role="img" aria-label="${done} of ${due.length} doses logged">
      <circle cx="80" cy="80" r="68" fill="none" stroke="var(--track)" stroke-width="14"/>
      <circle cx="80" cy="80" r="68" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(frac * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 80 80)" ${frac ? "" : 'opacity="0"'}/></svg>
      <div class="ov-ringtxt">${due.length ? `<span class="ov-big">${done}<span>/${due.length}</span></span><span class="small muted">doses logged</span>` : `<span class="ov-big" style="font-size:24px">None</span><span class="small muted">due today</span>`}</div></div>
    <div class="ov-stats"><div><span class="small muted">${cy ? esc(cy.phase || "Cycle") : "Cycle"}</span><b>${cy ? `${esc(cy.name || "Current")} · week ${cw.w}${cw.tot ? ` of ${cw.tot}` : ""}` : `<button class="ov-low linkbtn" data-act="cnewcyc">Set cycle dates</button>`}</b></div>

async function brunImport(files) {

    B.msg = "Claude is reading the markers…"; render();
    const opts = { modelTier: "default" }; if (images.length) opts.images = images.slice(0, maxImg);
    const out = await S.sample.json(BPROMPT + (text ? `\n\nThe report's text:\n${text}` : "\n\nThe report is in the images."), opts);

}

/* ---------- Methods, groups and starter budgets ---------- */
/* Group colours: four hues checked for colour-blind separation in both themes (var(--g1)…(--g4)) */

  "503020": { name: "50/30/20", groups: [["needs", "Needs", 50, 1], ["wants", "Wants", 30, 2], ["save", "Savings", 20, 3]],

  buckets: { name: "Buckets", groups: [["daily", "Daily expenses", 60, 1], ["splurge", "Splurge", 10, 2], ["fire", "Fire extinguisher", 20, 3], ["smile", "Smile", 10, 4]],
    blurb: "The Australian bucket approach: 60% for bills and living costs, 10% to spend guilt-free, 20% to put out money fires (emergencies and debt), and 10% saved for something that makes you smile." },
  zero: { name: "Zero-based", groups: [["needs", "Needs", null, 1], ["wants", "Wants", null, 2], ["save", "Savings", null, 3]],
    blurb: "Give every dollar a job until there's nothing left to assign. More hands-on than a percentage rule, but you decide exactly where it all goes." },

const bMethod = () => BMETHODS[S.bg.plan.method] || BMETHODS["503020"];
const bGroups = () => bMethod().groups.map(([k, name, pct, c]) => ({ k, name, pct, c }));
const bGroupOf = (cat) => { const m = S.bg.plan.method, keys = bGroups().map((g) => g.k); if (keys.includes(cat.group)) return cat.group; return BGMAP[cat.group]?.[m] || keys[0]; };
const bIsSave = (k) => ["save", "fire", "smile"].includes(k);
const BSTARTER = [
  ["needs", "Rent or mortgage", 25], ["needs", "Groceries", 9], ["needs", "Power, gas and water", 4], ["needs", "Phone and internet", 2.5], ["needs", "Transport and fuel", 4.5], ["needs", "Insurance", 3], ["needs", "Health and supplements", 2, "supps"],
  ["wants", "Eating out and takeaway", 8], ["wants", "Shopping", 6], ["wants", "Entertainment", 4], ["wants", "Subscriptions", 2], ["wants", "Gym and sport", 3], ["wants", "Gifts", 2], ["smile", "Holiday fund", 5],
  ["save", "Emergency fund", 12], ["save", "Extra debt repayments", 3],

const PERMONTH = { weekly: 52 / 12, fortnightly: 26 / 12, monthly: 1 };
const PAYWORD = { weekly: "a week", fortnightly: "a fortnight", monthly: "a month" };
const bIncome = () => num(S.bg.plan.income) * (PERMONTH[S.bg.plan.freq] || 1);

const bCats = () => [...S.bg.cats].sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));

const bSelMonth = () => S.bmonth || bMonthNow();
const bMonthAdd = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return dstr(d).slice(0, 7); };
/* Everything spent in a month: logged money out, plus supplement purchases for a linked category */
function bSpendRows(month) {
  const rows = Object.values(S.bg.tx).filter((t) => t.type !== "in" && t.date && monthKey(t.date) === month);
  const link = S.bg.cats.find((c) => c.link === "supps");
  if (link && typeof allPurchases === "function") for (const p of allPurchases()) if (p.date && monthKey(p.date) === month) rows.push({ id: "s-" + p.id, date: p.date, amount: num(p.price), cat: link.id, note: p.s.name, auto: "supps" });
  return rows.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

const bIncomeRows = (month) => Object.values(S.bg.tx).filter((t) => t.type === "in" && t.date && monthKey(t.date) === month);
function bByCat(month) { const o = {}; for (const r of bSpendRows(month)) o[r.cat || "none"] = (o[r.cat || "none"] || 0) + num(r.amount); return o; }
function bByGroup(month) { const bc = bByCat(month), o = {}; for (const g of bGroups()) o[g.k] = 0; for (const c of S.bg.cats) o[bGroupOf(c)] += bc[c.id] || 0; o.none = bc.none || 0; return o; }

  const months = days / 30.44; return { perMonth: left / months, perPay: bPerPay(left / months), left };

const round5 = (n) => Math.max(0, Math.round(n / 5) * 5);
function bStarter() {
  const inc = bIncome(); if (!inc) return [];
  const m = S.bg.plan.method, groups = bGroups(), out = [];
  const list = BSTARTER.map(([g, name, pct, link]) => ({ g: m === "buckets" ? (g === "needs" ? "daily" : g === "wants" ? "splurge" : g === "save" ? "fire" : "smile") : g === "smile" ? "save" : g, name, pct, link }));

  const top = Object.entries(catTot).filter(([k]) => { const c = S.bg.cats.find((x) => x.id === k); return !c || !bIsSave(bGroupOf(c)); }).sort((a, b) => b[1] - a[1]).slice(0, 6), topMax = top[0]?.[1] || 1;
  const active = data.filter((d) => d.spent || d.saved);
  html += `<div class="statgrid"><div class="stat"><div class="v">${money(active.reduce((a, d) => a + d.spent, 0) / Math.max(1, active.length))}</div><div class="k">average spent a month</div></div>
    <div class="stat"><div class="v">${Math.round((active.reduce((a, d) => a + d.saved, 0) / Math.max(1, active.reduce((a, d) => a + d.inc, 0))) * 100)}%</div><div class="k">average savings rate</div></div>
    <div class="stat"><div class="v">${active.filter((d) => plannedSpend && d.spent <= plannedSpend).length}/${active.length}</div><div class="k">months on budget</div></div></div>`;
  html += `<section class="card bcard"><div class="eyebrow">Biggest categories, last ${N} months</div><div class="share">${top.map(([k, v]) => { const c = S.bg.cats.find((x) => x.id === k), g = c ? groups.find((x) => x.k === bGroupOf(c)) : null; return `<div class="sh"><div class="row between"><span class="bname">${esc(c?.name || "Not categorised")}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${(v / topMax) * 100}%;background:${g ? gcol(g.c) : "var(--muted)"}"></i></div></div>`; }).join("")}</div></section>`;

}

/* ---------- Budget sample data for trying it out ---------- */
function bSample() {
  S.bg.plan = { income: "2600", freq: "fortnightly", method: "503020" };
  S.bg.cats = bStarter();
  const cur = bMonthNow(), tx = {}, today0 = new Date().getDate();
  const NOTES = { "Rent or mortgage": ["Rent"], Groceries: ["Woolworths", "Coles", "Aldi"], "Power, gas and water": ["Origin Energy"], "Phone and internet": ["Phone and NBN"], "Transport and fuel": ["Fuel", "Go card top-up"], Insurance: ["Health insurance"], "Eating out and takeaway": ["Uber Eats", "Dinner out", "Coffee"], Shopping: ["Clothes", "Kmart"], Entertainment: ["Movies", "Concert"], Subscriptions: ["Streaming"], "Gym and sport": ["Gym"], Gifts: ["Birthday present"], "Holiday fund": ["Holiday saver"], "Emergency fund": ["Transfer to savings"], "Extra debt repayments": ["Extra car loan payment"] };
  const SPLIT = { "Rent or mortgage": [1, 15], Groceries: [3, 10, 17, 24], "Transport and fuel": [6, 20], "Eating out and takeaway": [4, 11, 19, 26], Shopping: [9, 23], "Power, gas and water": [8], "Phone and internet": [5], Insurance: [12], Entertainment: [22], Subscriptions: [2], "Gym and sport": [2], Gifts: [18], "Holiday fund": [16], "Emergency fund": [16], "Extra debt repayments": [16] };
  for (let i = 5; i >= 0; i--) {
    const m = bMonthAdd(cur, -i);
    for (const c of S.bg.cats) {
      if (c.link) continue;
      const g = bGroupOf(c), seed = (i * 7 + c.name.length * 3) % 10;
      const f = c.name === "Rent or mortgage" || c.name === "Subscriptions" || c.name === "Gym and sport" ? 1 : g === "save" ? (seed > 6 ? 0.6 : 1) : g === "needs" ? 0.88 + seed * 0.025 : c.name === "Gifts" && seed < 5 ? 0 : 0.55 + seed * 0.08;
      const days = (SPLIT[c.name] || [14]).filter((d) => i > 0 || d <= today0), notes = NOTES[c.name] || [c.name];
      const all = SPLIT[c.name] || [14];
      days.forEach((d, k) => { const id = uid(); tx[id] = { id, date: `${m}-${String(d).padStart(2, "0")}`, amount: Math.round(((num(c.amount) * f) / all.length) * (f === 1 ? 1 : 1 + ((k % 2 ? -1 : 1) * seed) / 60)), cat: c.id, note: notes[k % notes.length], type: "out" }; });
    }
  }
  S.bg.tx = tx;
  S.bg.goals = [{ id: uid(), name: "Japan trip", target: 6000, by: dstr(new Date(new Date().getFullYear() + 1, 5, 30)), adds: [{ date: bMonthAdd(cur, -3) + "-01", amount: 1800 }, { date: cur + "-01", amount: 400 }] }, { id: uid(), name: "Emergency fund: 3 months", target: 12000, by: dstr(new Date(new Date().getFullYear() + 2, 0, 31)), adds: [{ date: bMonthAdd(cur, -5) + "-01", amount: 4200 }] }];
}

function tMonth() {
  const mo = S.tmo || tMonthNow(), cur = mo === tMonthNow(), t = today();
  const [y, m] = mo.split("-").map(Number), first = new Date(y, m - 1, 1), count = new Date(y, m, 0).getDate(), off = (first.getDay() + 6) % 7;
  const by = {};
  for (const x of tSorted()) if (x.due && x.due.startsWith(mo)) (by[x.due] ||= []).push(x);
  for (const k in by) by[k].sort((a, b) => !!a.done - !!b.done || TPRIS.indexOf(tPri(a)) - TPRIS.indexOf(tPri(b)));
  let html = `<div class="ov-head"><button class="iconbtn" data-act="tmonth" data-n="-1" aria-label="Previous month">${I.left}</button>
    <div class="grow"><div class="eyebrow">${esc(monthLabel(mo, true))}</div><h2 class="ov-title">${cur ? "This month" : esc(monthLabel(mo))}</h2></div>
    ${cur ? "" : `<button class="btn sm" data-act="tmonth" data-n="0">Today</button>`}
    <button class="iconbtn" data-act="tmonth" data-n="1" aria-label="Next month">${I.right}</button></div>`;
  let cells = KWEEK.map((d) => `<span class="wd">${DOW[d].slice(0, 1)}</span>`).join("");
  for (let i = 0; i < off; i++) cells += `<span class="tcell blank"></span>`;
  for (let d = 1; d <= count; d++) {
    const ds = `${mo}-${pad(d)}`, list = by[ds] || [];
    const lbl = `${shortD(ds, { weekday: "long", day: "numeric", month: "long" })}${list.length ? `, ${plural(list.length, "to-do")}` : ""}`;
    cells += `<button class="tcell ${ds === t ? "today" : ""} ${ds < t ? "past" : ""}" data-act="tday" data-d="${ds}" aria-pressed="${S.tday === ds}" aria-label="${esc(lbl)}"><span class="dn">${d}</span>${list.length ? `<span class="tmk">${list.slice(0, 4).map((x) => `<i class="p-${tPri(x)} ${x.done ? "done" : ""}"></i>`).join("")}${list.length > 4 ? `<b>+${list.length - 4}</b>` : ""}</span>` : ""}</button>`;
  }
  html += `<section class="card"><div class="tleg">${TPRIS.map((p) => `<span class="p-${p}"><i></i>${TPRI[p]}</span>`).join("")}<span><i class="hollow"></i>Done</span></div><div class="tcal">${cells}</div></section>`;
  const sel = S.tday && S.tday.startsWith(mo) ? S.tday : null;
  if (sel) {
    const list = by[sel] || [];
    html += `<section class="card"><div class="tdayhd"><div><div class="eyebrow">${sel === t ? "Today" : "Due on"}</div><h3 class="ov-tlabel">${esc(shortD(sel, { weekday: "long", day: "numeric", month: "long" }))}</h3></div><button class="btn sm" data-act="taddday">Add for this day</button></div>
      ${list.length ? `<ul class="tlist">${list.map(tRow).join("")}</ul>` : `<p class="small muted" style="margin:0">Nothing due this day.</p>`}</section>`;
  } else html += `<p class="hint" style="text-align:center">Tap a day to see what’s due.</p>`;
  const all = Object.keys(by).sort().flatMap((k) => by[k]);
  if (all.length) html += `<section class="card"><div class="eyebrow" style="margin-bottom:6px">Due in ${esc(monthLabel(mo, true))}</div><ul class="tlist">${all.map(tRow).join("")}</ul></section>`;
  else html += `<div class="card empty"><p>Nothing due in ${esc(monthLabel(mo, true))}. Give a to-do a due date and it shows up here.</p></div>`;
  const undated = S.td.items.filter((x) => !x.due && !x.done).length;
  if (undated) html += `<p class="hint" style="text-align:center">${plural(undated, "to-do")} without a due date ${undated === 1 ? "is" : "are"} only on the List.</p>`;

async function tRunOut(kind, id) {
  const x = (kind === "supp" ? S.supps : S.sk.products).find((y) => y.id === id); if (!x) return;
